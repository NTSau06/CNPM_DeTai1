# Khởi chạy Gateway, các backend service và SQL Server cùng kiểm tra sức khỏe, dữ liệu lưu trữ.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-QuangTri@2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\"; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\"; else bash -c '</dev/tcp/127.0.0.1/1433'; fi",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      POI_SERVICE_URL: http://poi-service:8001
      TOUR_SERVICE_URL: http://tour-service:8002
      NARRATION_SERVICE_URL: http://narration-service:8003
      ANALYTICS_SERVICE_URL: http://analytics-service:8004
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING:-DRIVER=ODBC Driver 18 for SQL Server;SERVER=sqlserver,1433;DATABASE=QuangTriDB;UID=sa;PWD=QuangTri@2026!;TrustServerCertificate=yes;}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:19006,http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
      poi-service:
        condition: service_healthy
      tour-service:
        condition: service_healthy
      narration-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  poi-service:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: uvicorn services.poi_service.main:app --host 0.0.0.0 --port 8001
    environment:
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING:-DRIVER=ODBC Driver 18 for SQL Server;SERVER=sqlserver,1433;DATABASE=QuangTriDB;UID=sa;PWD=QuangTri@2026!;TrustServerCertificate=yes;}
    expose:
      - "8001"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  tour-service:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: uvicorn services.tour_service.main:app --host 0.0.0.0 --port 8002
    environment:
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING:-DRIVER=ODBC Driver 18 for SQL Server;SERVER=sqlserver,1433;DATABASE=QuangTriDB;UID=sa;PWD=QuangTri@2026!;TrustServerCertificate=yes;}
      POI_SERVICE_URL: http://poi-service:8001
    expose:
      - "8002"
    depends_on:
      sqlserver:
        condition: service_healthy
      poi-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  narration-service:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: uvicorn services.narration_service.main:app --host 0.0.0.0 --port 8003
    environment:
      POI_SERVICE_URL: http://poi-service:8001
    expose:
      - "8003"
    depends_on:
      poi-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  analytics-service:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: uvicorn services.analytics_service.main:app --host 0.0.0.0 --port 8004
    environment:
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING:-DRIVER=ODBC Driver 18 for SQL Server;SERVER=sqlserver,1433;DATABASE=QuangTriDB;UID=sa;PWD=QuangTri@2026!;TrustServerCertificate=yes;}
    expose:
      - "8004"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  sqlserver-data:

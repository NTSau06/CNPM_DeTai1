name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'front-end-tmtddnn/**'
      - '.github/workflows/frontend-ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'front-end-tmtddnn/**'
      - '.github/workflows/frontend-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end-tmtddnn
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end-tmtddnn/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set GitHub Pages base path
        if: github.event_name != 'pull_request'
        run: echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Build for GitHub Pages
        if: github.event_name != 'pull_request'
        run: npm run build -- --base="$VITE_BASE_PATH"

      - name: Build for root path
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Add SPA fallback page
        if: github.event_name != 'pull_request'
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: front-end-tmtddnn/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Kiểm tra ứng dụng React Native và tùy chọn build native bằng EAS.
name: React Native CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'clients/mobile/**'
      - 'server/**'
      - '.github/workflows/mobile-ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'clients/mobile/**'
      - 'server/**'
      - '.github/workflows/mobile-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and export mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo-compatible package versions
        run: npx expo install --check

      - name: Type-check the native application
        run: npm run typecheck

      - name: Export the cross-platform web preview
        run: npm run build:web

      - name: Upload preview artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quang-tri-react-native-preview
          path: clients/mobile/dist
          if-no-files-found: error

  build-native:
    name: Build native app with Expo EAS
    if: github.ref == 'refs/heads/main' && vars.EAS_PROJECT_ID != ''
    needs: verify
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: npm ci

      - name: Build Android and iOS binaries
        if: env.EXPO_TOKEN != ''
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: npx eas-cli build --platform all --profile production --non-interactive

      - name: Explain native build setup
        if: env.EXPO_TOKEN == ''
        run: echo "Set the EXPO_TOKEN secret to enable EAS native builds."

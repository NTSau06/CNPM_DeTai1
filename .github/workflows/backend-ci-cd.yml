name: Backend Services CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test layered services and service communication
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Run unit and API tests
        env:
          PYTHONPATH: server
        run: python -m pytest server/tests/test_services.py -q

      - name: Start the complete service stack
        run: docker compose -f server/compose.yml up --build --wait --wait-timeout 120 -d

      - name: Exercise gateway, per-place analytics, narration and tours
        env:
          API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: python server/tests/smoke_api.py

      - name: Stop the service stack
        if: always()
        run: docker compose -f server/compose.yml down --remove-orphans

  publish:
    name: Publish backend container image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize container image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/quang-tri-services" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
